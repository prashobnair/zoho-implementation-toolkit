# Release gate (composite action)
#
# Diffs two Zoho manifests with zohokit, posts (or updates) one sticky PR
# comment, and uploads SARIF for code scanning. Requires zohokit on PATH
# (for example `pip install zohokit`, or this repo's `.venv/bin` on PATH).
#
# Least privilege for callers:
#   permissions: {contents: read, pull-requests: write, security-events: write}
#
# Hardening: no `${{ }}` interpolation appears inside any `run:` script.
# Every input and step output reaches the shell through `env:` and is only
# ever referenced as a quoted `"$VARIABLE"`. The optional baseline flag is
# built as a bash array (no word-splitting). Values that look like flags
# (`-*`) are refused, and `fail-on` is validated against its allowlist
# before use, so a hostile input can never become a zohokit option.

name: "Release gate"
description: "Diff Zoho manifests, maintain one sticky PR comment, upload SARIF."

inputs:
  before:
    description: "Path to the before manifest (component list or Manifest envelope)."
    required: true
  after:
    description: "Path to the after manifest (component list or Manifest envelope)."
    required: true
  fail-on:
    description: "Gate strictness: 'error' (default), 'high', 'medium' or 'never'."
    required: false
    default: "error"
  baseline:
    description: "Optional accepted-findings file (.zohokit-baseline.json)."
    required: false
    default: ""

outputs:
  ready:
    description: "'true' when the diff is ready, else 'false'."
    value: ${{ steps.gate.outputs.ready }}
  risk:
    description: "Release risk level: low, medium or high."
    value: ${{ steps.gate.outputs.risk }}

runs:
  using: "composite"
  steps:
    - name: Run the release diff
      id: gate
      shell: bash
      env:
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        set -euo pipefail
        for value in "$BEFORE" "$AFTER" "$BASELINE"; do
          case "$value" in
            -*) echo "release gate: refusing value starting with '-'" >&2; exit 1 ;;
          esac
        done
        if [ -z "$BEFORE" ] || [ -z "$AFTER" ]; then
          echo "release gate: before and after must both be set" >&2
          exit 1
        fi
        BASELINE_ARGS=()
        if [ -n "$BASELINE" ]; then
          BASELINE_ARGS=(--baseline "$BASELINE")
        fi
        zohokit release diff \
          --before "$BEFORE" \
          --after "$AFTER" \
          "${BASELINE_ARGS[@]}" \
          --format json --out gate-report.json \
          --pr-comment-out gate-comment.md \
          --deploy-order-out gate-order.json
        zohokit release diff \
          --before "$BEFORE" \
          --after "$AFTER" \
          "${BASELINE_ARGS[@]}" \
          --format sarif --out gate.sarif
        READY=$(python3 -c "import json; print('true' if json.load(open('gate-report.json'))['ready'] else 'false')")
        RISK=$(python3 -c "import json; print(json.load(open('gate-order.json'))['release_risk'])")
        echo "ready=$READY" >> "$GITHUB_OUTPUT"
        echo "risk=$RISK" >> "$GITHUB_OUTPUT"

    - name: Post or update the sticky PR comment
      id: comment
      uses: actions/github-script@v7
      with:
        script: |
          if (!context.payload.pull_request) {
            core.notice('release gate: no pull request in context; skipping sticky comment');
            return;
          }
          const fs = require('fs');
          const marker = '<!-- zohokit-release-gate -->';
          const body = fs.readFileSync('gate-comment.md', 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const prior = comments.find((c) => c.body && c.body.includes(marker));
          let comment;
          if (prior) {
            ({ data: comment } = await github.rest.issues.updateComment({
              owner, repo, comment_id: prior.id, body,
            }));
          } else {
            ({ data: comment } = await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            }));
          }
          core.setOutput('comment-url', comment.html_url);

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gate.sarif
        category: release-gate

    - name: Enforce the gate
      shell: bash
      env:
        READY: ${{ steps.gate.outputs.ready }}
        RISK: ${{ steps.gate.outputs.risk }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        case "$FAIL_ON" in
          error|high|medium|never) ;;
          *) echo "release gate: unsupported fail-on (error|high|medium|never)" >&2; exit 1 ;;
        esac
        case "$FAIL_ON" in
          error) [ "$READY" = "true" ] || { echo "release gate: report is not ready" >&2; exit 1; } ;;
          high) [ "$RISK" != "high" ] || { echo "release gate: high-risk promotion" >&2; exit 1; } ;;
          medium) { [ "$RISK" != "high" ] && [ "$RISK" != "medium" ]; } || { echo "release gate: medium-or-higher risk" >&2; exit 1; } ;;
          never) echo "release gate: comment only (fail-on=never)" ;;
        esac
