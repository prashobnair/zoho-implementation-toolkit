repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--strict, src]
        additional_dependencies:
          - pydantic>=2.7
          - typer>=0.12
          - httpx>=0.27
          - phonenumbers>=9.0
          - rich>=13.7
