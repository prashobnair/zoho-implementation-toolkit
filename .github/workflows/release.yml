name: release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: check-branch
        run: |
          if git ls-remote --exit-code --heads origin release-please--branches--main; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No release-please PR branch; nothing to do."
          fi
      - uses: actions/checkout@v7
        if: steps.check-branch.outputs.exists == 'true'
        with:
          ref: release-please--branches--main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        if: steps.check-branch.outputs.exists == 'true'
      - uses: actions/setup-python@v5
        if: steps.check-branch.outputs.exists == 'true'
        with:
          python-version: "3.11"
      - run: uv lock
        if: steps.check-branch.outputs.exists == 'true'
      - run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release): sync uv.lock"
          git push origin HEAD:release-please--branches--main
        if: steps.check-branch.outputs.exists == 'true'

  release-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv build
      - run: uv sync --locked
      - run: uv run zohokit migration audit tests/golden/legacy/migration/inputs/examples.json --format html --out sample-report.html
      - run: zip -r schemas.zip schemas
      - run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz sample-report.html schemas.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
