# Gitleaks config: default rules plus a narrow allowlist for synthetic test fixtures.
[extend]
useDefault = true

# The cassette-scan regression test (tests/unit/test_cassette_scan.py)
# plants an OAuth-shaped value to prove scanner output is value-free. It
# is assembled from string fragments at test runtime, is never a real
# credential ("abcdef12" is a placeholder), and never leaves the test
# process. Allowlist that exact fake string in that one file only; every
# other rule stays at default strictness.
# The cassette-quality test (tests/unit/test_cassette_quality.py) plants
# synthetic pagination-token shapes for the same reason (whole-token
# redaction proof). They are assembled from fragments at runtime, are
# never real tokens, and never leave the test process. Allowlist those
# exact fake strings in that one file only.
[allowlist]
description = "Synthetic OAuth/pagination-token scanner fixtures in test_cassette_scan.py and test_cassette_quality.py (not real credentials)."
paths = ['''tests/unit/test_cassette_scan\.py''', '''tests/unit/test_cassette_quality\.py''']
regexes = ['''1000\.abcdef12\.34567890''', '''90c6abcdef0123456789fc09f0abcdef''']
