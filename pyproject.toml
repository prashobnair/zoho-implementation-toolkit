[project]
name = "zohokit"
version = "0.2.0"
description = "An implementation engineer's safety kit for Zoho. One CLI, one report format, one safety model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prashob Nair" }]
keywords = ["zoho", "crm", "implementation", "migration", "reconciliation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "keyring>=25.7.0",
  "phonenumbers>=9.0",
  "pycountry>=23.0",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
zohokit = "zohokit.cli:main"

[project.entry-points."zohokit.modules"]
migration = "zohokit.cli.migration:app"
release = "zohokit.cli.release:app"
workflow = "zohokit.cli.workflow:app"
forms = "zohokit.cli.forms:app"
books = "zohokit.cli.books:app"
metrics = "zohokit.cli.metrics:app"
timeline = "zohokit.cli.timeline:app"
lead-routing = "zohokit.cli.lead_routing:app"

[project.urls]
Homepage = "https://github.com/prashobnair/zoho-implementation-toolkit"
Changelog = "https://github.com/prashobnair/zoho-implementation-toolkit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "bandit>=1.7",
  "hypothesis>=6.100",
  "import-linter>=1.8",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "ruff>=0.4",
  "syrupy>=4.0",
]
docs = [
  "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zohokit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["phonenumbers.*", "pycountry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "contract: connector tests replaying recorded cassettes (no network)",
  "eval: LLM evaluation suites with recorded responses",
  "bench: benchmarks (excluded from default CI)",
  "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["zohokit"]
branch = true

[tool.coverage.report]
show_missing = true
